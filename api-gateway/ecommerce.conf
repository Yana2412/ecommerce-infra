# ===========================================================
# API Gateway - srv-gateway (192.168.100.10)
# Archivo: /etc/nginx/conf.d/ecommerce.conf
# Punto único de entrada hacia los microservicios.
# Las solicitudes externas llegan por Cloudflare Tunnel.
# ===========================================================

# Microservicio de usuarios (srv-users, red privada)
upstream usuarios_service {
    server 192.168.100.11:8081;
}

# Microservicio de productos (srv-products, red privada)
upstream productos_service {
    server 192.168.100.12:8082;
}

server {
    listen 80 default_server;

    # Tamaño máximo de petición (carga de imágenes). Superado => 413.
    client_max_body_size 10M;

    # Cabeceras para que los microservicios conozcan al cliente original
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Autenticación -> microservicio de usuarios
    location /api/auth {
        proxy_pass http://usuarios_service;
    }

    # Gestión de usuarios -> microservicio de usuarios
    location /api/usuarios {
        proxy_pass http://usuarios_service;
    }

    # Productos e imágenes -> microservicio de productos
    location /api/productos {
        proxy_pass http://productos_service;
    }

    # Estado del gateway
    location = /health {
        default_type text/plain;
        return 200 "gateway ok\n";
    }

    # Cualquier otra ruta no definida se rechaza
    location / {
        return 404;
    }
}