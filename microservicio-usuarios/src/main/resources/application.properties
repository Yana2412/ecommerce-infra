server.port=8081

# Perfil activo:
#   memoria -> SIN conexion a BD, guarda usuarios en RAM (para probar la API
#              mientras no hay acceso de red a srv-data). Datos temporales,
#              se pierden al reiniciar la app.
#   bd      -> conecta de verdad a PostgreSQL en srv-data (192.168.100.30).
#              Config real en application-bd.properties.
#
# Para cambiar de modo, solo edita esta linea (no hace falta tocar mas nada):
spring.profiles.active=bd

# JWT
# IMPORTANTE: este secreto es solo para desarrollo. En srv-users, sobreescribe
# JWT_SECRET como variable de entorno (no lo subas al repo con un valor real).
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-muy-larga-y-aleatoria-de-al-menos-32-caracteres}
jwt.expiration-ms=3600000

# TEMPORAL: log detallado de Spring Security para diagnosticar el 401/403.
# Cuando ya funcione bien, borra esta linea (deja mucho ruido en consola).
logging.level.org.springframework.security=DEBUG
