# Perfil "bd": conexion real a PostgreSQL en srv-data.
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=bd
# (o poniendo spring.profiles.active=bd en application.properties).
#
# Las credenciales NO van en este archivo (el repositorio no debe contener
# contrasenas). Se leen de variables de entorno, definidas en srv-users en
# /etc/microservicio-usuarios.env (permisos 640, dueño root:angeles):
#   DB_USER      (opcional, por defecto usuarios_app)
#   DB_PASSWORD  (obligatoria)

spring.datasource.url=jdbc:postgresql://192.168.100.30:5432/ecommerce_usuarios
spring.datasource.username=${DB_USER:usuarios_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "validate": Hibernate solo COMPRUEBA que la tabla exista con las columnas
# esperadas; no crea ni modifica nada. La tabla la crea el administrador de la
# BD con database/usuarios/schema-postgresql.sql, y el usuario de la aplicacion
# solo tiene SELECT, INSERT y UPDATE (privilegios minimos).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
